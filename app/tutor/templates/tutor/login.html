{% extends "auth.html" %}
{% block title %}Вход — Open Tutor CRM{% endblock %}

{% block auth_title %}Вход{% endblock %}

{% block auth_form %}
    <form method="post" action="/tutor/login" class="form-stack">
        <div class="field">
            <label class="label" for="login-email">Email</label>
            <input class="input" id="login-email" type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
            <label class="label" for="login-password">Пароль</label>
            <input class="input" id="login-password" type="password" name="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Войти</button>
    </form>
{% endblock %}

{% block auth_footer %}
    <div class="auth__links">
        <a href="/tutor/register">Нет аккаунта? Зарегистрироваться</a>
        <a href="/tutor/remember-password">Забыли пароль?</a>
    </div>
{% endblock %}
