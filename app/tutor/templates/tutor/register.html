{% extends "base.html" %}
{% block title %}Регистрация — Open Tutor CRM{% endblock %}
{% block body %}
    <h1>Регистрация репетитора</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/tutor/register">
        <p><label>Имя <input type="text" name="name" value="{{ form.name }}" required></label></p>
        <p><label>Email <input type="email" name="email" value="{{ form.email }}" required></label></p>
        <p><label>Пароль <input type="password" name="password" required></label></p>
        <p><label>Повторите пароль <input type="password" name="password_confirm" required></label></p>
        <p><button type="submit">Зарегистрироваться</button></p>
    </form>

    <p><a href="/tutor/login">Уже есть аккаунт? Войти</a></p>
    <p><a href="/tutor/remember-password">Забыли пароль?</a></p>
{% endblock %}
