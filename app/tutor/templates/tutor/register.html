{% extends "auth.html" %}
{% block title %}Регистрация — Open Tutor CRM{% endblock %}

{% block auth_title %}Регистрация репетитора{% endblock %}

{% block auth_form %}
    <form method="post" action="/tutor/register" class="form-stack">
        <div class="field">
            <label class="label" for="reg-name">Имя</label>
            <input class="input" id="reg-name" type="text" name="name" value="{{ form.name }}" placeholder="Как вас зовут" required>
        </div>
        <div class="field">
            <label class="label" for="reg-email">Email</label>
            <input class="input" id="reg-email" type="email" name="email" value="{{ form.email }}" placeholder="you@example.com" required>
        </div>
        <div class="field">
            <label class="label" for="reg-password">Пароль</label>
            <input class="input" id="reg-password" type="password" name="password" placeholder="Минимум 8 символов" required>
        </div>
        <div class="field">
            <label class="label" for="reg-password-confirm">Повторите пароль</label>
            <input class="input" id="reg-password-confirm" type="password" name="password_confirm" placeholder="Ещё раз" required>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Зарегистрироваться</button>
    </form>
{% endblock %}

{% block auth_footer %}
    <div class="auth__links">
        <a href="/tutor/login">Уже есть аккаунт? Войти</a>
        <a href="/tutor/remember-password">Забыли пароль?</a>
    </div>
{% endblock %}
