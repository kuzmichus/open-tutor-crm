{% extends "base.html" %}
{% block title %}Новый пароль — Open Tutor CRM{% endblock %}
{% block body %}
    <h1>Установка нового пароля</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    {% if show_form %}
    <form method="post" action="/tutor/reset-password">
        <input type="hidden" name="key" value="{{ key }}">
        <p><label>Новый пароль <input type="password" name="password" required></label></p>
        <p><button type="submit">Сменить пароль</button></p>
    </form>
    {% endif %}

    <p><a href="/tutor/login">Вернуться ко входу</a></p>
{% endblock %}
