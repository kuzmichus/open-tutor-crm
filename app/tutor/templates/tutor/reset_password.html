{% extends "auth.html" %}
{% block title %}Новый пароль — Open Tutor CRM{% endblock %}

{% block auth_title %}Установка нового пароля{% endblock %}

{% block auth_form %}
    {% if show_form %}
    <form method="post" action="/tutor/reset-password" class="form-stack">
        <input type="hidden" name="key" value="{{ key }}">
        <div class="field">
            <label class="label" for="reset-password">Новый пароль</label>
            <input class="input" id="reset-password" type="password" name="password" placeholder="Минимум 8 символов" required>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Сменить пароль</button>
    </form>
    {% endif %}
{% endblock %}

{% block auth_footer %}
    <div class="auth__links">
        <a href="/tutor/login">Вернуться ко входу</a>
    </div>
{% endblock %}
