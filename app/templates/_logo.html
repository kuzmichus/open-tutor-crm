<svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="36" height="36" role="img" aria-hidden="true" focusable="false">

    </defs>
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#brand-logo-gradient)"/>
    <!-- облако диалога -->
    <path d="M14 22 Q14 14 22 14 L42 14 Q50 14 50 22 L50 34 Q50 42 42 42 L30 42 L22 50 L24 42 L22 42 Q14 42 14 34 Z"
          fill="#FFFFFF" opacity="0.95"/>

    <g fill="#EC4899" transform="translate(32 28)">
        <circle r="6" fill="none" stroke="#EC4899" stroke-width="3"/>
        <circle r="2" fill="#EC4899"/>

            <line x1="0" y1="-9" x2="0" y2="-11"/>

            <line x1="6.5" y1="-6.5" x2="8" y2="-8"/>
            <line x1="-6.5" y1="6.5" x2="-8" y2="8"/>
