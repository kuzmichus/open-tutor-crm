# Контракт тестового стенда TaskDesk (stands/launch).
# TaskDesk выделяет свободный порт и передаёт его в переменной PORT;
# скрипт старта поднимает приложение на этом порту.
#
# База — SQLite (штатный режим проекта, см. README «Конфигурация»):
# отдельный PostgreSQL стенду не нужен, файл базы лежит в корне чекаута
# (tutor.db исключён из git). Схему создаёт только Alembic.
up = ".taskdesk/stand-up.sh"
port_env = "PORT"
health_path = "/health"

[stand.env]
DATABASE_URL = "sqlite:///./tutor.db"
# Зона сервера влияет на значение по умолчанию при регистрации репетитора.
TZ = "Europe/Ulyanovsk"
# Лендинг существует только в сингл-режиме: без флага страницы
# `/tutor/landing` на стенде не видно (роуты отвечают 404).
SINGLE_MODE = "true"

# Наполнение стенда данными (контракт stands/seed): TaskDesk запускает скрипт
# до stand-up.sh, передавая выбранный пресет в TD_SEED_PRESET. Скрипт сам
# поднимает схему (seed-фаза идёт до старта приложения) и печатает JSON
# с учётными данными последней непустой строкой stdout.
[seed]
seed_script = ".taskdesk/seed.sh"
seed_presets = ["demo", "minimal"]
