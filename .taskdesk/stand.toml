# Контракт запуска тестового стенда TaskDesk (см. задание).
#
# Приложение хранит данные в SQLite и не имеет драйвера PostgreSQL,
# поэтому отдельная база не запрашивается: скрипт старта сам создаёт
# файл базы во временном каталоге стенда.
up = "scripts/stand_up.sh"
port_env = "PORT"
health_path = "/health"

[stand.env]
# Зона сервера влияет на значения по умолчанию при регистрации репетитора.
TZ = "Europe/Ulyanovsk"
