# Проверки проекта: один и тот же набор для push, pull_request и вызова
# из workflow публикации (release.yml).
#
# Почему переиспользуемый workflow, а не копия шагов в release.yml: две копии
# неизбежно расходятся — правку в тестах забудут перенести в релиз, и «тесты
# прошли» перестанет что-то значить. `workflow_call` даёт одну точку правки.
name: CI

on:
  push:
  pull_request:
  workflow_call:

# Проверкам нужно только чтение: они ничего не коммитят и не создают теги.
permissions:
  contents: read

# Повторный пуш в ту же ветку отменяет предыдущий прогон: его результат уже
# никому не нужен, а минуты раннера не бесконечны.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # У astral-sh/setup-uv нет плавающего мажорного тега (только vX.Y.Z и
      # старые vX до 6): ссылка на v10 роняет джобу ещё на «Set up job»,
      # поэтому пин к точной версии. Остальные экшены имеют мажорные теги.
      - name: Установить uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      # --frozen: окружение ровно по uv.lock, без пере-резолвинга зависимостей.
      # Тесты не ходят в сеть: urlopen подменяется monkeypatch в тестах.
      - name: Установить зависимости
        run: uv sync --frozen
      - name: Прогнать тесты
        run: uv run pytest -n auto

  lock:
    name: Lock-файл
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Установить uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      # pyproject.toml изменён, а uv.lock — нет: образ собирается по lock-файлу,
      # поэтому расхождение должно ловиться до merge, а не при сборке образа.
      - name: Проверить соответствие uv.lock манифесту
        run: uv lock --check

  migrations:
    name: Схема миграций
    runs-on: ubuntu-latest
    env:
      # Пустая БД в рабочем каталоге раннера: реальный tutor.db не участвует.
      DATABASE_URL: sqlite:///./ci-check.db
    steps:
      - uses: actions/checkout@v7
      - name: Установить uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Установить зависимости
        run: uv sync --frozen
      - name: Применить миграции на чистой базе
        run: uv run alembic upgrade head
      # `alembic check`, а не только `upgrade`: отвечает на вопрос «модели
      # совпадают со схемой?», а не «миграции применяются?». Именно это
      # закрепляет правило «схема меняется только миграцией»: правка модели
      # без ревизии даёт красный PR.
      - name: Проверить отсутствие дрейфа схемы
        run: uv run alembic check

  lint:
    name: Линт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Установить uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      # Узкий набор: только синтаксические ошибки и неопределённые имена.
      # Дефолтный набор сейчас красный, а `ruff format --check` затронул бы
      # 239 файлов — широкие правила включаются отдельным PR.
      # Версия пинуется здесь, а не в pyproject.toml: правка зависимостей
      # потянула бы uv.lock и сломала --frozen-сборку образа ради инструмента,
      # который в образ не попадает.
      - name: Проверить синтаксис и имена
        run: uvx ruff@0.15.20 check --select E9,F63,F7,F82 app/ tests/ main.py cron.py

  docker:
    name: Сборка образа и смоук
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Собрать образ
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # load — образ остаётся в локальном демоне, чтобы его можно было
          # запустить на следующем шаге.
          load: true
          tags: open-tutor-crm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Сборка проходит и при отсутствующем модуле, если он импортируется
      # лениво. Запуск контейнера поднимает весь путь импорта main.py и
      # проверяет, что в образ попали все нужные файлы: Dockerfile копирует
      # пути явно, поэтому новый каталог в корне легко забыть.
      - name: Поднять контейнер и дождаться /health
        run: |
          docker run -d --name otc-smoke -p 18000:8000 open-tutor-crm:ci
          python3 - <<'PY'
          import json
          import sys
          import time
          import urllib.request

          deadline = time.monotonic() + 60
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:18000/health", timeout=3
                  ) as response:
                      body = json.load(response)
              except Exception as exc:  # noqa: BLE001 - ждём, пока контейнер поднимется
                  last_error = exc
              else:
                  if body.get("status") == "ok":
                      print("GET /health ->", body)
                      sys.exit(0)
                  last_error = f"неожиданный ответ: {body}"
              time.sleep(2)
          print(f"::error::GET /health не ответил за 60 секунд: {last_error}")
          sys.exit(1)
          PY
      - name: Логи контейнера и остановка
        if: always()
        run: |
          docker logs otc-smoke || true
          docker rm -f otc-smoke || true
