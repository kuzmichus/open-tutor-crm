# Ночной образ: ежедневный снапшот ветки main под единственным тегом night.
#
# Почему отдельный файл, а не триггер schedule в release.yml: релизный workflow
# — «только вручную, только с явно указанной версией», его workflow_dispatch
# требует обязательный input, который расписание передать не может. Ночной
# канал — другой контракт: night — не релиз, он не создаёт git-тегов и
# GitHub-релизов, не двигает latest и не зависит от версии в pyproject.toml.
name: Nightly

on:
  # 03:17 МСК: ночь по московскому времени, но не ровный час — GitHub
  # отбрасывает часть запусков на пиковых :00, поэтому минуты сдвинуты.
  schedule:
    - cron: "17 0 * * *"
  # Ручной запуск: проверить workflow сразу после merge, не дожидаясь ночи.
  workflow_dispatch:

permissions:
  contents: read

# Если вчерашний прогон ещё выполняется (завис на push в реестр), новый не
# должен рвать его посреди отправки: одновременные ночные публикации дрались
# бы за один тег night.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Тот же набор проверок, что на push: красный main ночью не должен уезжать
  # в реестр — night по умолчанию воспринимают как «последнее рабочее состояние».
  checks:
    name: Проверки
    uses: ./.github/workflows/ci.yml

  publish:
    name: Публикация ночного образа
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Войти в Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Единственный тег ночного канала: каждая успешная ночь перезаписывает
      # его, релизные теги (latest, версия, sha-*) остаются release.yml.
      # linux/amd64 — как в релизе, поэтому QEMU не нужен.
      - name: Собрать и опубликовать
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: kuzmichus/open-tutor-crm:night
          cache-from: type=gha
          cache-to: type=gha,mode=max
