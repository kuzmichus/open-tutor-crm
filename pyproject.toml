[project]
name = "open-tutor-crm"
version = "0.1.0"
description = "Открытая CRM для репетиторов"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "jinja2>=3.1",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "reducethemtokens>=0.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
